<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>valentine?</title>
</head>
<body class="container">
    <div class="night"></div>
    <div class="text">
        <div class="wrapper">
            <div class="lid one"></div>
            <div class="lid two"></div>
            <div class="envelope"></div>
            <div class="letter" id="letter">
                <p>Happy Valentine's Day ❤️</p>
            </div>
        </div>
        <div class="buttons">
            <button id="openBtn">Open</button>
            <button id="closeBtn" style="display: none;">Close</button>
        </div>
    </div>

    <div class="flowers">
        <!-- كل عناصر الزهور كما هي -->
    </div>

    <script>
        const openBtn = document.getElementById('openBtn');
        const closeBtn = document.getElementById('closeBtn');
        const letter = document.getElementById('letter');

        openBtn.addEventListener('click', () => {
            letter.innerHTML = `
                <p>Hey this is for you. 👸 🫵🏻</p>
                <p>I know you’re going through a lot even when you’re not telling me.<br>
                I can feel it. I can feel your pain. I can feel when you’re angry or sad or happy.<br>
                Even when you try to hide it, I know.</p>
                <p>I want to tell you that I’m very proud of you and I’ll always be here with you :)</p>
                <p>With my love,<br>Youssef</p>
            `;
            openBtn.style.display = 'none';
            closeBtn.style.display = 'inline-block';
        });

        closeBtn.addEventListener('click', () => {
            letter.innerHTML = `<p>Happy Valentine's Day ❤️</p>`;
            openBtn.style.display = 'inline-block';
            closeBtn.style.display = 'none';
        });
    </script>
</body>
</html>
